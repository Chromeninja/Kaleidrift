name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          include-templates: true
          use-dotnet: false
      - name: Parse and start project
        run: godot --headless --rendering-method gl_compatibility --path . --quit-after 1
      - name: Run deterministic and integration tests
        run: |
          godot --headless --path . --script res://scripts/tests/procedural_music_smoke_test.gd
          godot --headless --path . --script res://scripts/tests/survival_smoke_test.gd
          godot --headless --path . --script res://scripts/tests/survival_integration_test.gd
          godot --headless --path . --script res://scripts/tests/platform_smoke_test.gd
          godot --headless --path . --script res://scripts/tests/resource_load_validation.gd
  build-validation:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          include-templates: true
          use-dotnet: false
      - name: Export Web and Windows
        run: |
          godot --headless --rendering-method gl_compatibility --path . --export-release "Web" build/web/index.html
          godot --headless --path . --export-debug "Windows Desktop" build/windows/Kaleidrift.exe
      - name: Validate exported files
        run: |
          test -f build/web/index.html
          test -f build/web/index.js
          test -f build/web/index.wasm
          test -f build/web/index.pck
          test -f build/windows/Kaleidrift.exe
          test -f build/windows/Kaleidrift.pck
          cd build/windows && zip -r Kaleidrift-windows.zip Kaleidrift.exe Kaleidrift.pck
      - uses: actions/upload-artifact@v4
        with:
          name: validation-builds
          path: build
          retention-days: 7
